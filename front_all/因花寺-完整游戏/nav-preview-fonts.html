v><section class="panel" id="panel" hidden></section></main><script>
const scenes={gate:{img:'assets/arrival.webp',act:'序章',chapter:'山门 · 入寺',eye:'循水而行，花影渐深',title:'此刻，<br>且随风入山。',hint:'向下滚动，慢慢走近'},pool:{img:'original/chapters/wish/assets/scene.webp',act:'第二幕',chapter:'许愿池 · 寄愿',eye:'一枚铜钱，一份心愿',title:'这一池水，<br>会替你收好。',hint:'向下滚动，走近许愿池'},hall:{img:'assets/hall.webp',act:'第三幕',chapter:'无问殿 · 观心',eye:'心有所问，静待一念',title:'缓步入殿，<br>照见此刻的心。',hint:'向下滚动，走向拜垫'}};let selected='gate';const panel=document.querySelector('#panel');function setScene(key){selected=key;const s=scenes[key];document.querySelector('#scene').src=s.img;for(const id of ['act','chapter','hint'])document.querySelector('#'+id).textContent=s[id];document.querySelector('#eyebrow').textContent=s.eye;document.querySelector('#title').innerHTML=s.title;document.querySelectorAll('[data-scene]').forEach(b=>b.classList.toggle('active',b.dataset.scene===key));panel.hidden=true;}document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>setScene(b.dataset.scene));function mode(m){document.querySelector('#stage').classList.toggle('mobile',m);document.querySelector('#mobile').classList.toggle('active',m);document.querySelector('#desktop').classList.toggle('active',!m);}document.querySelector('#mobile').onclick=()=>mode(true);document.querySelector('#desktop').onclick=()=>mode(false);if(innerWidth<650)mode(true);document.querySelector('#sound').onclick=function(){this.classList.toggle('selected');this.querySelector('span').textContent=this.classList.contains('selected')?'声音已开':'听风';};document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{const type=b.dataset.panel;if(!panel.hidden&&panel.dataset.type===type){panel.hidden=true;return;}panel.dataset.type=type;panel.hidden=false;panel.innerHTML=type==='map'?'<h2>寺院地图</h2><img src="assets/temple-map.png" alt="寺院地图"><button data-jump="gate">山门</button><button data-jump="pool">许愿池</button><button data-jump="hall">无问殿</button>':type==='help'?'<h2>慢慢走，不必着急</h2><p>向下滚动前行，向上滚动回望。手机上可向上或向下滑动。</p><p>选择心念、许愿与存念时，按画面提示操作。</p>':'<h2>重新走这一段</h2><p>回到当前场景的开始。</p><button id="restart">重新开始</button>';panel.querySelectorAll('[data-jump]').forEach(x=>x.onclick=()=>setScene(x.dataset.jump));panel.insertAdjacentHTML('beforeend','<div class="font-note" id="fontNote"></div>');updateFontNote();if(panel.querySelector('#restart'))panel.querySelector('#restart').onclick=()=>setScene(selected);});

const stage=document.querySelector('#stage'),unfold=document.querySelector('.unfold');
for(const btn of document.querySelectorAll('.functions button'))if(!btn.hasAttribute('aria-label'))btn.setAttribute('aria-label',btn.textContent.trim());
document.querySelectorAll('[data-variant]').forEach(btn=>btn.onclick=()=>{stage.classList.remove('bare','fold','open');stage.classList.add(btn.dataset.variant);unfold.setAttribute('aria-expanded','false');panel.hidden=true;document.querySelectorAll('[data-variant]').forEach(x=>x.classList.toggle('active',x===btn));});
unfold.onclick=()=>{const expanded=stage.classList.toggle('open');unfold.setAttribute('aria-expanded',String(expanded));unfold.setAttribute('aria-label',expanded?'收起导航':'展开导航');if(!expanded)panel.hidden=true;};
document.addEventListener('keydown',e=>{if(e.key==='Escape'){stage.classList.remove('open');panel.hidden=true;unfold.setAttribute('aria-expanded','false');}});

const descriptions={serif:'静雅：思源宋体标题 700 · 思源黑体导航 600 / 正文 400',sans:'清晰：思源黑体标题 700 · 导航 600 / 正文 400',kai:'文气：楷体标题 700 · 微软雅黑导航 600 / 等线正文 400'};let fontChoice='serif';function updateFontNote(){const n=document.querySelector('#fontNote');if(n)n.textContent=descriptions[fontChoice];}document.querySelectorAll('[data-font]').forEach(btn=>btn.onclick=()=>{fontChoice=btn.dataset.font;stage.classList.remove('font-serif','font-sans','font-kai');stage.classList.add('font-'+fontChoice);document.querySelectorAll('[data-font]').forEach(x=>x.classList.toggle('active',x===btn));updateFontNote();});document.querySelector('[data-panel="help"]').click();
</script></body></html>
