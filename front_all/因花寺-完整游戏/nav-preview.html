<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>因花寺 · 顶部导航样式预览</title><style>
:root{--ink:#34564e;--paper:#e5eee5;--line:#52746633}*{box-sizing:border-box}body{margin:0;background:#d9e3dd;color:var(--ink);font-family:'SimSun','Songti SC',serif}button{font:inherit;color:inherit;cursor:pointer}button:focus-visible{outline:2px solid #719d83;outline-offset:4px}.preview-tools{min-height:70px;padding:15px 32px;display:flex;align-items:center;gap:24px;background:#f3f5ef;border-bottom:1px solid var(--line)}.preview-tools strong{font-size:16px;font-weight:normal}.preview-tools span{font:12px/1.5 sans-serif;color:#64776d}.switches{display:flex;gap:5px;margin-left:auto}.switches button{border:1px solid var(--line);background:transparent;padding:8px 15px;border-radius:4px;font-size:13px}.switches button.active{background:#34564e;color:#f2f2e7}.stage{position:relative;width:100%;height:calc(100svh - 70px);min-height:560px;overflow:hidden;margin:auto;transition:width .25s;background:#9eb4a5}.stage.mobile{width:390px;height:844px;max-width:100%}.scene{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.tint{position:absolute;inset:0;background:linear-gradient(#163b2910,transparent 35%,#173c3440)}.nav{position:absolute;top:0;left:0;right:0;z-index:5;height:78px;display:flex;align-items:center;padding:0 34px;gap:28px;background:#e9f0e5ed;border-bottom:1px solid #f8f6e9a8;box-shadow:0 2px 18px #183c3010}.brand{display:flex;align-items:center;gap:12px;white-space:nowrap}.brand img{width:35px;height:35px;object-fit:contain}.brand strong{font-size:23px;font-weight:normal;letter-spacing:4px}.chapter{border-left:1px solid var(--line);padding-left:25px;display:flex;flex-direction:column;gap:6px;min-width:115px}.chapter small{font-size:10px;letter-spacing:2px;color:#718479}.chapter span{font-size:15px;letter-spacing:2px}.functions{display:flex;align-items:center;gap:7px;margin-left:auto}.nav button{display:flex;align-items:center;gap:8px;padding:11px 13px;border:0;background:transparent;border-radius:4px;white-space:nowrap;font-size:13px;letter-spacing:1px}.nav button:hover,.nav button.selected{background:#52746613}.nav svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round}.map-button{border-right:1px solid var(--line)!important;border-radius:0!important;margin-right:9px;padding-right:24px!important}.map-button img{width:27px;height:27px;object-fit:contain}.scene-copy{position:absolute;left:9%;top:38%;color:#f7f3e5;text-shadow:0 2px 16px #173b3050}.scene-copy p{font-size:14px;letter-spacing:5px}.scene-copy h1{font-weight:normal;font-size:43px;letter-spacing:9px;line-height:1.7;margin:20px 0}.bottom-hint{position:absolute;bottom:48px;left:50%;transform:translateX(-50%);color:#fff9e9;font-size:13px;letter-spacing:3px;white-space:nowrap}.bottom-hint:before{content:'';display:block;width:1px;height:30px;background:#fff9e98c;margin:0 auto 16px}.panel{position:absolute;right:32px;top:94px;z-index:6;width:280px;padding:24px;background:#edf1e7fa;border:1px solid #fff8de80;box-shadow:0 12px 40px #183c3030;line-height:1.9;font-size:14px}.panel[hidden]{display:none}.panel h2{font-size:18px;font-weight:normal;margin:0 0 15px}.panel button{border:1px solid var(--line);background:transparent;padding:6px 10px;margin:4px}.panel img{width:100%;display:block}.mobile .nav{height:108px;padding:12px 17px;gap:14px;flex-wrap:wrap;align-content:center}.mobile .brand strong{font-size:19px}.mobile .brand img{width:27px;height:27px}.mobile .chapter{min-width:0;padding-left:15px;gap:3px}.mobile .chapter small{font-size:9px}.mobile .chapter span{font-size:13px}.mobile .functions{width:100%;margin:0;justify-content:space-between;gap:0}.mobile .nav button{font-size:11px;padding:5px 8px;gap:5px;letter-spacing:0}.mobile .map-button{padding-right:12px!important;margin-right:0}.mobile .map-button img{width:22px;height:22px}.mobile .nav svg{width:16px;height:16px}.mobile .scene-copy{left:28px;top:38%}.mobile .scene-copy h1{font-size:30px;letter-spacing:5px}.mobile .scene-copy p{font-size:11px;letter-spacing:3px}.mobile .panel{top:122px;right:16px;width:calc(100% - 32px)}@media(max-width:650px){.preview-tools{padding:12px;gap:8px;flex-wrap:wrap}.preview-tools span{display:none}.switches{margin-left:0}.switches button{padding:7px 10px}.stage{height:calc(100svh - 100px)}body .stage{width:390px;max-width:100%}}
</style><body><div class="preview-tools"><strong>顶部导航 · 样式预览</strong><span>切换场景，查看导航在不同画面中的效果</span><div class="switches"><button class="active" data-scene="gate">山门</button><button data-scene="pool">许愿池</button><button data-scene="hall">无问殿</button></div><div class="switches"><button id="desktop" class="active">桌面</button><button id="mobile">手机</button></div></div><main class="stage" id="stage"><img class="scene" id="scene" src="assets/arrival.webp" alt="寺院场景"><div class="tint"></div><header class="nav"><div class="brand"><img src="assets/flower-logo.png" alt=""><strong>因花寺</strong></div><div class="chapter"><small id="act">序章</small><span id="chapter">山门 · 入寺</span></div><nav class="functions" aria-label="寺院功能"><button class="map-button" data-panel="map"><img src="assets/map-scroll-art.png" alt="">寺院地图</button><button id="sound"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4zM17 8q5 4 0 8"/></svg><span>听风</span></button><button data-panel="help"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 4m0 3v.1"/></svg>操作提示</button><button data-panel="replay"><svg viewBox="0 0 24 24"><path d="M4 11a8 8 0 1 1 2 7M4 5v6h6"/></svg>重游</button></nav></header><div class="scene-copy"><p id="eyebrow">循水而行，花影渐深</p><h1 id="title">此刻，<br>且随风入山。</h1></div><div class="bottom-hint" id="hint">向下滚动，慢慢走近</div><section class="panel" id="panel" hidden></section></main><script>
const scenes={gate:{img:'assets/arrival.webp',act:'序章',chapter:'山门 · 入寺',eye:'循水而行，花影渐深',title:'此刻，<br>且随风入山。',hint:'向下滚动，慢慢走近'},pool:{img:'original/chapters/wish/assets/scene.webp',act:'第二幕',chapter:'许愿池 · 寄愿',eye:'一枚铜钱，一份心愿',title:'这一池水，<br>会替你收好。',hint:'向下滚动，走近许愿池'},hall:{img:'assets/hall.webp',act:'第三幕',chapter:'无问殿 · 观心',eye:'心有所问，静待一念',title:'缓步入殿，<br>照见此刻的心。',hint:'向下滚动，走向拜垫'}};let selected='gate';const panel=document.querySelector('#panel');function setScene(key){selected=key;const s=scenes[key];document.querySelector('#scene').src=s.img;for(const id of ['act','chapter','hint'])document.querySelector('#'+id).textContent=s[id];document.querySelector('#eyebrow').textContent=s.eye;document.querySelector('#title').innerHTML=s.title;document.querySelectorAll('[data-scene]').forEach(b=>b.classList.toggle('active',b.dataset.scene===key));panel.hidden=true;}document.querySelectorAll('[data-scene]').forEach(b=>b.onclick=()=>setScene(b.dataset.scene));function mode(m){document.querySelector('#stage').classList.toggle('mobile',m);document.querySelector('#mobile').classList.toggle('active',m);document.querySelector('#desktop').classList.toggle('active',!m);}document.querySelector('#mobile').onclick=()=>mode(true);document.querySelector('#desktop').onclick=()=>mode(false);if(innerWidth<650)mode(true);document.querySelector('#sound').onclick=function(){this.classList.toggle('selected');this.querySelector('span').textContent=this.classList.contains('selected')?'声音已开':'听风';};document.querySelectorAll('[data-panel]').forEach(b=>b.onclick=()=>{const type=b.dataset.panel;if(!panel.hidden&&panel.dataset.type===type){panel.hidden=true;return;}panel.dataset.type=type;panel.hidden=false;panel.innerHTML=type==='map'?'<h2>寺院地图</h2><img src="assets/temple-map.png" alt="寺院地图"><button data-jump="gate">山门</button><button data-jump="pool">许愿池</button><button data-jump="hall">无问殿</button>':type==='help'?'<h2>慢慢走，不必着急</h2><p>向下滚动前行，向上滚动回望。手机上可向上或向下滑动。</p><p>选择心念、许愿与存念时，按画面提示操作。</p>':'<h2>重新走这一段</h2><p>回到当前场景的开始。</p><button id="restart">重新开始</button>';panel.querySelectorAll('[data-jump]').forEach(x=>x.onclick=()=>setScene(x.dataset.jump));if(panel.querySelector('#restart'))panel.querySelector('#restart').onclick=()=>setScene(selected);});
</script></body></html>
