<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>因花寺 · 动态操作指示预览</title><style>
*{box-sizing:border-box}body{margin:0;background:#183e34;color:#fff9eb;font-family:"Microsoft YaHei",sans-serif}.scene{position:fixed;inset:0;background:url('assets/arrival.webp') center/cover}.shade{position:fixed;inset:0;background:linear-gradient(#153b2520,transparent 55%,#102c3050)}header{position:relative;padding:30px 38px;display:flex;gap:20px;align-items:center}header strong{font-size:18px}header span{font-size:12px;opacity:.8}main{position:fixed;bottom:9%;left:50%;transform:translateX(-50%);display:flex;gap:64px;align-items:flex-end}.option{text-align:center;width:180px}.hint{height:112px;display:grid;place-items:center;position:relative}.mouse{width:27px;height:43px;border:1.5px solid currentColor;border-radius:15px;position:relative;filter:drop-shadow(0 2px 4px #102b30)}.wheel{position:absolute;width:3px;height:8px;border-radius:4px;background:currentColor;left:10.5px;top:7px;animation:wheel 1.9s ease-in-out infinite}.arrows{position:absolute;top:78px;display:grid;gap:4px}.arrows i{width:8px;height:8px;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:rotate(45deg);animation:arrow 1.9s infinite}.arrows i+ i{animation-delay:.22s}.ring{position:absolute;width:76px;height:23px;border:1px solid #fff9eb55;border-radius:50%;bottom:1px;animation:ripple 2.6s infinite}.ring.second{animation-delay:1.3s}.label{font-size:12px;letter-spacing:.14em;text-shadow:0 2px 7px #12352e;margin-top:18px}.note{font-size:11px;opacity:.65;margin-top:10px}.bare .label{visibility:hidden}.frost{width:92px;margin:auto;border-radius:46px;background:#eaf4df12;backdrop-filter:blur(5px);border:1px solid #ffffee24}.swipe{height:42px;width:2px;background:linear-gradient(transparent,#fff9eb80,transparent);position:relative}.swipe:before{content:'';width:8px;height:8px;background:#fff9eb;border-radius:50%;position:absolute;left:-3px;animation:swipe 2s infinite;box-shadow:0 0 12px #fff9eb70}@keyframes wheel{0%{transform:translateY(0);opacity:0}25%{opacity:1}75%{transform:translateY(9px);opacity:.8}100%{transform:translateY(11px);opacity:0}}@keyframes arrow{0%,100%{opacity:.12}45%{opacity:.9}}@keyframes ripple{0%{transform:scale(.5);opacity:0}30%{opacity:.5}100%{transform:scale(1.25);opacity:0}}@keyframes swipe{0%{top:36px;opacity:0}25%{opacity:1}80%{top:0;opacity:1}100%{top:0;opacity:0}}@media(max-width:650px){header{padding:24px;display:block}header span{display:block;margin-top:10px}main{gap:5px;width:100%;justify-content:center}.option{width:32%}.note{font-size:10px}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
