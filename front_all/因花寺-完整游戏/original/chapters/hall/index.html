  <style>
    :root{--gold:#e8c780;--paper:#f5ecd8;--ink:#372619;--red:#8d3128}
    *{box-sizing:border-box}
    html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#180f0c;color:var(--paper);font-family:"Noto Serif SC","Songti SC","STSong",serif;user-select:none}
    button{font:inherit}
    .experience{position:fixed;inset:0;width:100%;height:100%;overflow:clip;isolation:isolate;background:#261511;cursor:ns-resize}
    .scene{position:absolute;inset:-7%;overflow:hidden;background:#271711;transform-origin:50% 52%;will-change:transform,filter;transition:filter .8s ease}
    .scene img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.02);transition:opacity .75s ease;pointer-events:none}
    .scene img.active{opacity:1}
    .scene::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 43%,transparent 25%,rgba(25,8,3,.12) 63%,rgba(14,6,4,.62) 105%);pointer-events:none}
    .grain{position:absolute;inset:0;z-index:8;opacity:.10;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E")}
    .topbar{position:absolute;z-index:30;top:0;left:0;right:0;padding:24px 30px;display:flex;justify-content:space-between;align-items:flex-start;background:linear-gradient(rgba(29,14,9,.6),transparent)}
    .brand{display:flex;align-items:center;gap:13px;letter-spacing:.32em;font-size:14px;text-shadow:0 2px 12px #000}
    .brand-mark{width:31px;height:31px;border:1px solid rgba(238,207,143,.72);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:17px;letter-spacing:0}
    .controls{display:flex;gap:8px}
    .icon-btn{width:38px;height:38px;border-radius:50%;border:1px solid rgba(255,239,203,.27);color:#fff4d5;background:rgba(42,19,11,.32);backdrop-filter:blur(8px);cursor:pointer;transition:.25s}
    .icon-btn:hover{background:rgba(114,57,29,.55);border-color:rgba(255,225,164,.6)}
    .guide{position:absolute;z-index:25;left:50%;top:12%;transform:translateX(-50%);text-align:center;width:min(88vw,520px);filter:drop-shadow(0 2px 8px #3d1609);transition:opacity .5s,transform .5s}
    .guide.hidden{opacity:0;transform:translate(-50%,-8px);pointer-events:none}
    .guide .eyebrow{font:11px/1.4 system-ui,sans-serif;letter-spacing:.35em;color:#f5dca8;margin-bottom:8px;opacity:.85}
    .guide h1{font-weight:400;font-size:clamp(24px,3vw,42px);letter-spacing:.22em;margin:0 0 9px;text-indent:.22em}
    .guide p{margin:0;color:rgba(255,247,225,.82);font-size:14px;letter-spacing:.16em;line-height:1.8}
    .hint{position:absolute;z-index:31;left:50%;bottom:34px;transform:translateX(-50%);display:flex;align-items:center;gap:13px;padding:10px 18px;border:1px solid rgba(248,224,172,.35);border-radius:30px;background:rgba(35,16,10,.53);backdrop-filter:blur(10px);font:12px/1 system-ui,sans-serif;letter-spacing:.13em;white-space:nowrap;box-shadow:0 8px 35px rgba(27,7,2,.2);transition:.35s}
    .mouse{width:17px;height:27px;border:1px solid rgba(255,241,208,.75);border-radius:10px;position:relative}
    .mouse::before{content:"";position:absolute;left:7px;top:5px;width:2px;height:6px;border-radius:2px;background:var(--gold);animation:scroll 1.5s infinite}
    @keyframes scroll{0%{transform:translateY(0);opacity:0}35%{opacity:1}100%{transform:translateY(8px);opacity:0}}
    .pad-hotspot{position:absolute;z-index:15;left:50%;bottom:9%;transform:translateX(-50%);width:min(31vw,390px);height:min(18vw,190px);border:0;background:transparent;cursor:pointer;border-radius:50%;transition:.3s;outline:none}
    .pad-hotspot::after{content:"";position:absolute;inset:5%;border:1px solid rgba(255,222,149,0);border-radius:50%;box-shadow:0 0 0 0 rgba(246,202,114,0);transition:.3s}
    .pad-hotspot:hover::after,.pad-hotspot:focus-visible::after{border-color:rgba(255,222,149,.75);box-shadow:0 0 32px 4px rgba(246,202,114,.25)}
    .cursor-guide{position:absolute;z-index:36;left:50%;bottom:17%;width:clamp(74px,11vw,126px);height:clamp(74px,11vw,126px);transform:translate(-18%,18%) rotate(-7deg);opacity:0;pointer-events:none;transition:opacity .4s,transform .4s;filter:drop-shadow(0 9px 12px rgba(34,10,3,.34))}
    .cursor-guide.show{opacity:1;transform:translate(0,0) rotate(-7deg);animation:cursorFloat 2.2s ease-in-out infinite}
    .cursor-guide img{width:100%;height:100%;object-fit:contain}
    .cursor-guide::after{content:"点击拜垫";position:absolute;left:62%;top:70%;padding:7px 10px;border:1px solid rgba(255,232,177,.42);border-radius:14px;background:rgba(49,19,10,.72);color:#ffecc3;font:11px system-ui,sans-serif;letter-spacing:.1em;white-space:nowrap}
    @keyframes cursorFloat{0%,100%{margin-top:0}50%{margin-top:-8px}}
    .hands{position:absolute;z-index:18;left:50%;bottom:-30%;width:min(60vw,620px);height:min(62vh,540px);transform:translateX(-50%);opacity:0;transition:opacity .65s,bottom 1.1s cubic-bezier(.2,.8,.2,1);pointer-events:none;filter:drop-shadow(0 12px 25px rgba(43,12,4,.36))}
    .posture-switch{display:none;min-width:76px;height:38px;padding:0 13px;border-radius:20px;border:1px solid rgba(255,239,203,.27);color:#fff4d5;background:rgba(42,19,11,.32);backdrop-filter:blur(8px);cursor:pointer;font-size:12px;letter-spacing:.08em;transition:.25s}
    .posture-switch.show{display:block}
    .posture-switch:hover{background:rgba(114,57,29,.55);border-color:rgba(255,225,164,.6)}
    .hands.visible{bottom:-12%;opacity:1}
    .open-hands-photo{position:absolute;z-index:2;left:50%;bottom:-8%;width:min(73vw,780px);height:min(74vh,680px);transform:translateX(-50%) scale(.92);opacity:1;transition:opacity .8s,transform .8s;filter:drop-shadow(0 12px 25px rgba(43,12,4,.25))}
    .open-hands-photo img,.pray-photo img{width:100%;height:100%;object-fit:contain}
    .pray-photo{position:absolute;z-index:3;left:50%;bottom:-7%;width:min(55vw,560px);height:min(58vh,580px);transform:translateX(-50%) scale(.9);opacity:0;transition:opacity .8s,transform .8s;filter:drop-shadow(0 12px 25px rgba(43,12,4,.25))}
    .hands.joined .open-hands-photo{opacity:0;transform:translateX(-50%) scale(.98)}
    .hands.joined .pray-photo{opacity:1;transform:translateX(-50%) scale(1)}
    .hands.kneeling{bottom:-21%;transform:translateX(-50%) scale(.9)}
    .hands.kneeling .pray-photo{bottom:-2%;transform:translateX(-50%) scale(.92)}
    .press-target{position:absolute;z-index:24;left:50%;bottom:16%;transform:translateX(-50%);width:min(52vw,540px);height:56%;border:0;border-radius:48% 48% 20% 20%;background:transparent;cursor:pointer;display:none;touch-action:none}
    .press-target.show{display:block}
    .hold-ring{position:absolute;z-index:28;left:50%;top:53%;width:92px;height:92px;transform:translate(-50%,-50%);display:grid;place-items:center;border-radius:50%;background:conic-gradient(var(--gold) var(--hold,0%),rgba(255,245,222,.18) 0);opacity:0;transition:opacity .25s;pointer-events:none}
    .hold-ring::before{content:"按住\A 合掌";white-space:pre;display:grid;place-items:center;width:76px;height:76px;border-radius:50%;background:rgba(60,25,15,.8);border:1px solid rgba(255,228,169,.4);font-size:13px;line-height:1.55;letter-spacing:.15em;text-align:center;color:#fff2d2}
    .hold-ring.show{opacity:1}
    .bow-shade{position:absolute;z-index:19;inset:0;background:linear-gradient(rgba(14,5,3,.6),rgba(33,12,7,.12) 40%,rgba(12,5,3,.65));opacity:0;pointer-events:none}
    .glow{position:absolute;z-index:17;left:50%;top:34%;width:15vmin;height:15vmin;transform:translate(-50%,-50%) scale(.2);border-radius:50%;background:radial-gradient(circle,#fffbd6 0,#ffdf7a 20%,rgba(255,190,56,.6) 43%,rgba(255,170,28,0) 72%);opacity:0;mix-blend-mode:screen;pointer-events:none}
    .glow.reveal{animation:reveal 4.5s ease-out forwards}
    .glow::before,.glow::after{content:"";position:absolute;inset:-130%;background:repeating-conic-gradient(from 0deg,rgba(255,224,124,0) 0 8deg,rgba(255,228,133,.14) 9deg 12deg,rgba(255,224,124,0) 13deg 23deg);animation:rotate 18s linear infinite}
    .glow::after{inset:-70%;filter:blur(10px);animation-direction:reverse}
    @keyframes reveal{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}30%{opacity:.92}100%{opacity:.72;transform:translate(-50%,-50%) scale(4.8)}}
    @keyframes rotate{to{transform:rotate(1turn)}}
    .manifest{position:absolute;z-index:26;inset:0;display:grid;place-items:center;background:radial-gradient(circle,rgba(255,238,163,.08),rgba(35,11,5,.16));opacity:0;pointer-events:none;transition:opacity 1.4s}
    .manifest.show{opacity:1}
    .manifest-card{text-align:center;margin-top:-4vh;text-shadow:0 3px 22px #4d1809}
    .manifest-card .seal{width:62px;height:62px;margin:0 auto 22px;border:1px solid rgba(255,240,194,.78);border-radius:50%;display:grid;place-items:center;font-size:30px;color:#ffe9a9;box-shadow:0 0 40px rgba(255,198,74,.55),inset 0 0 24px rgba(255,210,101,.23)}
    .manifest-card h2{font-size:clamp(29px,4vw,54px);font-weight:400;letter-spacing:.35em;text-indent:.35em;margin:0 0 14px}
    .manifest-card p{font-size:14px;letter-spacing:.22em;color:#ffe8b5;margin:0}
    .progress{position:absolute;z-index:32;right:28px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}
    .progress span{width:5px;height:5px;border-radius:50%;background:rgba(255,242,214,.4);transition:.3s}
    .progress span.on{height:31px;border-radius:4px;background:#f2d18c;box-shadow:0 0 14px rgba(246,205,116,.55)}
    .toast{position:absolute;z-index:50;left:50%;top:25%;transform:translate(-50%,-12px);padding:10px 17px;border-radius:20px;background:rgba(39,16,9,.72);border:1px solid rgba(255,229,177,.32);font:13px/1.5 system-ui,sans-serif;letter-spacing:.08em;opacity:0;transition:.35s;pointer-events:none}
    .toast.show{opacity:1;transform:translate(-50%,0)}
    .vignette{position:absolute;z-index:40;inset:0;box-shadow:inset 0 0 120px 20px rgba(20,5,2,.45);pointer-events:none}
    /* 抽签：把签筒当作第二次回殿时才被发现的物件 */
    .lot-layer{position:absolute;z-index:22;inset:0;opacity:0;pointer-events:none;transition:opacity 1.2s ease}
    .lot-layer.returning{opacity:.01}
    .lot-layer.active{opacity:1;pointer-events:auto}
    .lot-layer::before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 18% 62%,rgba(255,188,94,.14),transparent 17%),linear-gradient(rgba(21,7,3,.14),rgba(18,6,3,.38));opacity:0;transition:opacity 1.4s;pointer-events:none}
    .lot-layer.active::before{opacity:1}
    .lot-halo{position:absolute;left:17.5%;bottom:22%;width:min(20vw,240px);height:min(39vw,420px);transform:translate(-50%,10%) scale(.7);border-radius:50%;background:radial-gradient(ellipse,rgba(255,194,90,.32),rgba(255,168,49,.12) 28%,rgba(255,155,37,0) 69%);filter:blur(7px);opacity:0;transition:opacity .8s,transform 1s;pointer-events:none}
    .lot-layer.active .lot-halo{opacity:.66;transform:translate(-50%,0) scale(1)}
    .lot-tube{position:absolute;left:17%;bottom:14%;width:min(18vw,190px);height:min(43vw,430px);padding:0;border:0;background:transparent;cursor:grab;transform:translate(-50%,8%) scale(.88) rotate(0deg);transform-origin:50% 94%;opacity:.74;filter:drop-shadow(0 15px 22px rgba(24,7,2,.44));transition:transform .45s cubic-bezier(.2,.8,.2,1),filter .45s,opacity .5s;touch-action:none}
    .lot-tube img{width:100%;height:100%;object-fit:contain;pointer-events:none}
    .lot-tube:hover,.lot-tube:focus-visible{opacity:1;transform:translate(-50%,0) scale(.96) rotate(-1deg);filter:drop-shadow(0 16px 26px rgba(255,175,65,.24))}
    .lot-tube:active,.lot-tube.picked{cursor:grabbing;transform:translate(-50%,0) scale(1) rotate(var(--tube-rotate,0deg));filter:drop-shadow(0 21px 33px rgba(255,175,65,.38))}
    .lot-tube.settling{animation:tubeSettle 2.2s ease-in-out infinite}
    .lot-tube.drop-ready{animation:tubeNudge 1.7s ease-in-out infinite}
    .lot-touch{position:absolute;left:105%;top:47%;min-width:148px;padding:9px 12px;border:1px solid rgba(255,229,177,.35);border-radius:16px;background:rgba(42,17,9,.78);color:#ffecc3;font:12px/1.4 system-ui,sans-serif;letter-spacing:.11em;white-space:nowrap;opacity:0;transform:translateX(-8px);transition:.35s;pointer-events:none}
    .lot-tube:hover .lot-touch,.lot-tube:focus-visible .lot-touch,.lot-tube.picked .lot-touch{opacity:1;transform:translateX(0)}
    @keyframes tubeSettle{0%,100%{transform:translate(-50%,0) scale(1) rotate(-1deg)}50%{transform:translate(-50%,0) scale(1) rotate(1deg)}}
    @keyframes tubeNudge{0%,100%{transform:translate(-50%,0) scale(1) rotate(0)}45%{transform:translate(-50%,0) scale(1) rotate(-4deg)}65%{transform:translate(-50%,0) scale(1) rotate(2deg)}}
    .lot-sign{position:absolute;left:50%;bottom:11%;width:min(25vw,265px);height:min(17vw,178px);transform:translate(-50%,35%) rotate(-6deg);opacity:0;pointer-events:none;transition:opacity .4s,transform .8s cubic-bezier(.2,.8,.2,1);perspective:900px}
    .lot-sign.visible{opacity:1;transform:translate(-50%,0) rotate(-3deg);pointer-events:auto}
    .lot-sign.fallen{animation:signDrop .95s cubic-bezier(.2,.85,.25,1) both}
    @keyframes signDrop{0%{opacity:0;transform:translate(-50%,-240%) rotate(12deg)}70%{opacity:1;transform:translate(-50%,12%) rotate(-7deg)}100%{opacity:1;transform:translate(-50%,0) rotate(-3deg)}}
    .sign-paper{position:relative;width:100%;height:100%;border:1px solid rgba(92,47,19,.52);background:linear-gradient(145deg,#f6f2e9,#ddd7cc);box-shadow:0 17px 33px rgba(22,6,2,.4),inset 0 0 0 5px rgba(255,239,191,.18);transform-style:preserve-3d;transition:transform 1.15s cubic-bezier(.2,.75,.25,1);cursor:pointer}
    .lot-sign.flipped .sign-paper{transform:rotateY(180deg)}
    .sign-face{position:absolute;inset:0;display:grid;place-items:center;backface-visibility:hidden;color:#4b2a1d;text-align:center}
    .sign-front{font-size:clamp(36px,5vw,70px);font-weight:500;letter-spacing:.18em;text-indent:.18em}
    .sign-front::after{content:"签";display:block;font-size:11px;letter-spacing:.28em;text-indent:.28em;margin-top:6px;opacity:.65}
    .sign-back{transform:rotateY(180deg);padding:17px;flex-direction:column;gap:7px}
    .sign-back b{font-size:clamp(18px,2.1vw,25px);font-weight:500;letter-spacing:.16em}
    .sign-back span{font-size:12px;letter-spacing:.14em;opacity:.76}
    .reading-panel,.action-overlay{position:absolute;z-index:34;inset:0;display:grid;place-items:center;background:rgba(19,7,4,.48);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .7s}
    .reading-panel.show,.action-overlay.show{opacity:1;pointer-events:auto}
    .reading-shell{width:min(90vw,560px);padding:38px 44px 30px;text-align:center;border:1px solid rgba(255,226,167,.35);background:linear-gradient(145deg,rgba(65,30,15,.91),rgba(37,14,8,.94));box-shadow:0 20px 80px rgba(19,4,1,.4);color:#f9e7bf;transform:translateY(14px);transition:transform .7s}
    .reading-panel.show .reading-shell,.action-overlay.show .reading-shell{transform:translateY(0)}
    .reading-kicker{font:11px/1.5 system-ui,sans-serif;letter-spacing:.28em;color:#e2bb77;margin-bottom:14px}
    .reading-shell h2{font-size:clamp(23px,3vw,34px);font-weight:400;letter-spacing:.18em;text-indent:.18em;margin:0 0 17px}
    .reading-shell p{min-height:56px;margin:0 auto 26px;max-width:430px;font-size:15px;line-height:2;letter-spacing:.11em;color:rgba(255,242,213,.86)}
    .reading-next,.action-submit{min-width:152px;padding:11px 20px;border:1px solid rgba(255,225,163,.45);border-radius:24px;background:rgba(131,65,27,.35);color:#fff0c9;font-size:13px;letter-spacing:.14em;cursor:pointer;transition:.25s}
    .reading-next:hover,.reading-next:focus-visible,.action-submit:hover,.action-submit:focus-visible{background:rgba(173,95,40,.5);border-color:rgba(255,228,168,.8);transform:translateY(-1px)}
    .reading-dots{display:flex;justify-content:center;gap:6px;margin-top:22px}
    .reading-dots i{width:5px;height:5px;border-radius:50%;background:rgba(255,232,187,.28);transition:.25s}
    .reading-dots i.on{width:22px;border-radius:4px;background:#e6bd76}
    .action-shell{width:min(90vw,610px);padding:34px 38px 30px;text-align:left}
    .action-shell h2{text-align:center;font-size:25px;font-weight:400;letter-spacing:.16em;text-indent:.16em;margin:0 0 9px}
    .action-shell>p{text-align:center;margin:0 0 24px;color:rgba(255,239,210,.74);font-size:13px;letter-spacing:.1em}
    .action-field{display:block;margin:0 0 15px;color:#efd6a7;font-size:12px;letter-spacing:.14em}
    .action-field textarea{display:block;width:100%;height:65px;margin-top:8px;resize:vertical;border:1px solid rgba(255,223,163,.25);border-radius:8px;padding:11px 12px;background:rgba(20,7,4,.48);color:#fff2d5;font:14px/1.6 "Noto Serif SC","Songti SC",serif;outline:none;user-select:text}
    .action-field textarea:focus{border-color:rgba(255,216,142,.75);box-shadow:0 0 0 3px rgba(255,194,83,.1)}
    .action-submit{display:block;margin:21px auto 0}
    .receipt{display:none;text-align:center}
    .action-overlay.done .action-form{display:none}.action-overlay.done .receipt{display:block}
    .receipt-seal{width:58px;height:58px;margin:0 auto 19px;border:1px solid rgba(255,236,184,.7);border-radius:50%;display:grid;place-items:center;color:#f7d995;font-size:28px;box-shadow:0 0 30px rgba(240,177,65,.23)}
    .receipt h3{margin:0 0 12px;font-weight:400;font-size:26px;letter-spacing:.19em;text-indent:.19em}.receipt p{margin:0;color:rgba(255,240,210,.78);font-size:13px;letter-spacing:.12em;line-height:1.9}
    .screen-dim{position:absolute;z-index:20;inset:0;background:rgba(11,3,2,.46);opacity:0;pointer-events:none;transition:opacity 1.2s}.screen-dim.on{opacity:1}
    .video-bridge{position:absolute;z-index:24;inset:0;background:#160b08;opacity:0;pointer-events:none;transition:opacity 1.2s ease}
    .video-bridge.show{opacity:1;pointer-events:auto}
    .video-bridge video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.78) contrast(.98) brightness(.7);pointer-events:none}
    .video-bridge::after{content:"";position:absolute;inset:0;background:linear-gradient(rgba(16,6,4,.28),rgba(20,7,4,.5)),radial-gradient(circle at 50% 46%,transparent 16%,rgba(9,3,2,.44) 100%);pointer-events:none}
    .bridge-progress{position:absolute;z-index:2;left:50%;bottom:54px;width:min(38vw,420px);height:2px;transform:translateX(-50%);background:rgba(255,235,190,.22);overflow:hidden}
    .bridge-progress i{display:block;width:0;height:100%;background:#e5bf79;box-shadow:0 0 12px rgba(255,203,111,.7);transition:width .18s ease}
    .bridge-label{position:absolute;z-index:2;left:50%;top:14%;transform:translateX(-50%);text-align:center;opacity:0;transition:opacity .8s;color:#f3dfb4;text-shadow:0 2px 16px rgba(28,7,2,.7);pointer-events:none}
    .video-bridge.show .bridge-label{opacity:1}
    .bridge-label b{display:block;font-weight:400;font-size:clamp(23px,3vw,38px);letter-spacing:.22em;text-indent:.22em}
    .bridge-label span{display:block;margin-top:10px;font-size:13px;letter-spacing:.16em;color:rgba(255,238,202,.78)}
    .lot-closeup{position:absolute;z-index:16;inset:0;background:#2a120a;opacity:0;pointer-events:none;transition:opacity 1.4s;overflow:hidden}
    .lot-closeup img{width:100%;height:100%;object-fit:cover;object-position:48% 54%;filter:saturate(.82) contrast(.98) brightness(.58) blur(1px);opacity:.72}
    .lot-closeup.on{opacity:1}
    @media(max-width:700px){.lot-tube{left:20%;bottom:16%;width:28vw;height:55vw}.lot-halo{left:20%;bottom:24%;width:34vw;height:55vw}.lot-touch{left:105%;min-width:130px;font-size:11px}.lot-sign{left:52%;bottom:14%;width:48vw;height:29vw}.reading-shell,.action-shell{padding:28px 24px 24px}.reading-shell p{min-height:72px}}
    @media(max-width:700px){.topbar{padding:17px}.brand{font-size:12px}.guide{top:13%}.progress{right:14px}.hint{bottom:20px}.hands{width:92vw;height:55vh}.pad-hotspot{width:58vw;height:32vw}}

  function reset(){readingEpoch++;signBusy=false;signStatus.hide();readingNext.hidden=false;flowTimers.forEach(clearTimeout);flowTimers=[];state='approach';approach=0;bow=0;hold=0;posture='standing';window.bowed=false;autoMoving=false;shakeDistance=0;pointerId=null;lastPointer=null;shots.forEach((im,i)=>im.classList.toggle('active',i===0));scene.removeAttribute('style');hands.className='hands';hands.removeAttribute('style');target.className='press-target';ring.className='hold-ring';ring.style.setProperty('--hold','0%');bowShade.removeAttribute('style');glow.className='glow';manifest.className='manifest';videoBridge.classList.remove('show');bridgeVideo.pause();bridgeVideo.currentTime=0;bridgeProgress.style.width='0%';lotLayer.className='lot-layer';lotCloseup.classList.remove('on');screenDim.classList.remove('on');lotSign.className='lot-sign';readingPanel.classList.remove('show');actionOverlay.className='action-overlay';actionForm.reset();guide.classList.remove('hidden');hint.removeAttribute('style');hotspot.removeAttribute('style');cursorGuide.classList.remove('show');postureBtn.classList.remove('show');postureBtn.textContent='行礼姿势';setText('approach');hintText.textContent='向下滚动 · 或点击拜垫';dot(0)}
  function say(msg){toast.textContent=msg;toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),1500)}
  hotspot.addEventListener('click',arrive); postureBtn.addEventListener('click',togglePosture); target.addEventListener('pointerdown',e=>{e.preventDefault();target.setPointerCapture(e.pointerId);beginHold()});target.addEventListener('pointerup',endHold);target.addEventListener('pointercancel',endHold);
  lotTube.addEventListener('pointerdown',e=>{e.preventDefault();startShake(e,state==='dropReady')});lotTube.addEventListener('pointermove',moveShake);lotTube.addEventListener('pointerup',endShake);lotTube.addEventListener('pointercancel',endShake);lotTube.addEventListener('pointerenter',()=>{if(state==='signHint')lotTube.classList.add('drop-ready')});lotTube.addEventListener('pointerleave',()=>{if(state==='signHint')lotTube.classList.remove('drop-ready')});lotSign.addEventListener('click',revealSign);readingNext.addEventListener('click',nextReading);actionForm.addEventListener('submit',e=>{e.preventDefault();if(state!=='realityAction')return;state='complete';actionOverlay.classList.add('done');say('这一小步已收好')});
  $('#restartBtn').addEventListener('click',reset);$('#soundBtn').addEventListener('click',e=>{audioOn=!audioOn;e.currentTarget.textContent=audioOn?'音':'静';e.currentTarget.setAttribute('aria-label',audioOn?'关闭声音':'开启声音');say(audioOn?'声音已开启':'声音已关闭')});
  videoBridge.addEventListener('wheel',e=>{if(state!=='videoBridge')return;e.preventDefault();e.stopPropagation();scrubBridge(e.deltaY)},{passive:false});
  window.addEventListener('wheel',wheel,{passive:false});window.addEventListener('keydown',e=>{if(e.key==='ArrowDown')wheel({preventDefault(){},deltaY:100});if(e.key==='ArrowUp')wheel({preventDefault(){},deltaY:-100});if(e.key==='Enter'&&state==='approach')arrive();if(e.key===' '&&state==='ready'){e.preventDefault();join()}if((e.key===' '||e.key==='ArrowLeft'||e.key==='ArrowRight')&&['signHint','signPick','dropReady'].includes(state)){e.preventDefault();shakeByKeyboard()}if(e.key==='Enter'&&state==='signDrop')revealSign()});
  let touchY=0;window.addEventListener('touchstart',e=>touchY=e.touches[0].clientY,{passive:true});window.addEventListener('touchmove',e=>{const y=e.touches[0].clientY,dy=touchY-y;if(Math.abs(dy)>12){wheel({preventDefault(){},deltaY:dy});touchY=y}},{passive:true});
  renderApproach();
  // Optional local preview starts at the completed receipt; normal entry keeps the full ritual.
  if(new URLSearchParams(location.search).get('preview')==='bodhi'){
    state='complete';
    guide.classList.add('hidden');hint.style.opacity='0';hotspot.style.pointerEvents='none';
    lotCloseup.classList.add('on');screenDim.classList.add('on');
    actionOverlay.classList.add('show','done');dot(6);
  }
})();
