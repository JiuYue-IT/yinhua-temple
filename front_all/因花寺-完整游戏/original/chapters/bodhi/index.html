        <circle cx="110" cy="110" r="70" fill="#f9e598" opacity=".48" filter="url(#fruitGlow)"/>
        <g class="half left"><path d="M106 48C80 45 56 65 50 91c-6 27 4 58 27 73 11 7 22 9 29 6l4-72z" fill="url(#fruitSkin)" stroke="#657b39" stroke-width="2"/><path d="M91 66c-12 11-18 24-17 39" fill="none" stroke="#f8efb2" stroke-width="3" opacity=".7"/></g>
        <g class="half right"><path d="M114 48c26-3 50 17 56 43 6 27-4 58-27 73-11 7-22 9-29 6l-4-72z" fill="url(#fruitSkin)" stroke="#657b39" stroke-width="2"/><path d="M129 66c12 11 18 24 17 39" fill="none" stroke="#f8efb2" stroke-width="3" opacity=".7"/></g>
        <path d="M105 50c5 10 5 21 5 34s0 24 5 34c-5 11-5 21-5 34" fill="none" stroke="#fff7c6" stroke-width="3" stroke-dasharray="4 6" opacity=".9"/>
      </svg>
      <img class="hand" src="assets/hand.png" alt="一只托起的手掌">
      <div class="palm-glow" aria-hidden="true"></div>
      <div class="copy" id="copy"><div class="eyebrow">A QUIET RETURN</div><h1 id="copyText">你已走到此处。</h1></div>
      <audio id="signAudio" preload="auto" ></audio>
      <div class="sign-reveal" id="signReveal" aria-hidden="true">
        <span class="sign-shard s1"></span><span class="sign-shard s2"></span><span class="sign-shard s3"></span>
        <article class="sign-sheet" aria-label="参悟签文">
          <div class="sign-kicker">菩提树下 · 收此一念</div>
          <div class="sign-title"><div><small>A THOUGHT OF</small><br><small>THIS MOMENT</small></div><strong>一</strong><div class="sign-date">此刻<br>心安</div></div>
          <div class="sign-line"></div>
          <p class="sign-text" id="detailIntro">回应正在凝成，请稍候。</p><div class="reading-details" id="readingDetails"></div>
          <div class="sign-mark" hidden></div>
          <div class="sign-reflection">
            <div class="sign-verse" hidden></div>
            <span class="sign-seal">一念</span>
          </div>
          <div class="sign-actions"><button class="save-thought" id="saveThought" type="button">存此一念</button></div>
        </article>
      </div>
      <div class="final-copy" id="finalCopy">果已得。路仍长。</div>
    </section>
    <p class="hint" id="hint">向下滚动，让这一幕慢慢发生</p>
    <span class="wheel-mark" aria-hidden="true"></span>
    <span class="progress" id="progress" aria-hidden="true"></span>
  </main>
  <script>
    const stage = document.querySelector('#stage');
    const scene = document.querySelector('#scene');
    const afterScene = document.querySelector('#afterScene');
    const copy = document.querySelector('#copy');
    const copyText = document.querySelector('#copyText');
    const finalCopy = document.querySelector('#finalCopy');
    const signReveal = document.querySelector('#signReveal');
    const saveThought = document.querySelector('#saveThought');
    const signAudio = document.querySelector('#signAudio');
    const fruit = document.querySelector('.fruit');
    const fruitDrop = document.querySelector('.fruit-drop');
    const hand = document.querySelector('.hand');
    const palmGlow = document.querySelector('.palm-glow');
    const clusters = [...document.querySelectorAll('.cluster')];
    const particles = document.querySelector('#particles');
    const hint = document.querySelector('#hint');
    const progress = document.querySelector('#progress');
    // 手动滚轮的剧情顺序：先清空樱花，再聚光，再切换果后背景，最后果实落掌。
    const progressSteps = [0, 2100, 5050, 8050, 10050, 14100, 15700, 17100, 18400];
    const maxProgress = progressSteps.length - 1;
    let progressIndex = 0;
    let wheelLocked = false;
    let lastWheelAt = -Infinity;
    let wheelTimer;
    let manualMode = false;
    const messages = [
      [0, '你已走到此处。'],
      [2100, '花相尽褪，心念归一。'],
      [5050, '散去的，不是花。<br>是你一路放不下的念。'],
      [8050, '一念，终于成形。'],
      [10050, '你所得的，不是答案。<br>是一颗看清之后的果。'],
      [14100, '来时问路，去时得果。']
    ];
    let timers = [];
    let runId = 0;
    function makeParticles() {
      particles.innerHTML = '';
      for (let i = 0; i < 34; i++) {
        const el = document.createElement('i');
        el.className = 'particle';
        const x = 5 + Math.random() * 90;
        const y = 24 + Math.random() * 53;
        const dx = (49 - x) * (9 + Math.random() * 10);
        const dy = (45 - y) * (5 + Math.random() * 7);
        el.style.setProperty('--x', `${x}%`);
        el.style.setProperty('--y', `${y}%`);
        el.style.setProperty('--dx', `${dx}px`);
        el.style.setProperty('--dy', `${dy}px`);
        el.style.setProperty('--size', `${3 + Math.random() * 5}px`);
        el.style.setProperty('--delay', `${Math.random() * 1.8}s`);
        particles.appendChild(el);
      }
    }
    function clearRun() { timers.forEach(clearTimeout); timers = []; }
    function showSplit() {
      stage.classList.add('fruit-split-active');
      fruit.style.opacity = 0;
      fruitDrop.style.opacity = 0;
    }
    function showSign() {
      const wasVisible = signReveal.classList.contains('show');
      stage.classList.add('sign-stage');
      signReveal.classList.add('show');
      signReveal.setAttribute('aria-hidden', 'false');
      copy.classList.remove('show');
      finalCopy.classList.remove('show');
      if (signAudio && !wasVisible) { signAudio.currentTime = 0; signAudio.play().catch(() => {}); }
    }
    function hideSign() {
      stage.classList.remove('sign-stage');
      signReveal.classList.remove('show');
      signReveal.setAttribute('aria-hidden', 'true');
      if (signAudio) { signAudio.pause(); signAudio.currentTime = 0; }
    }
    function setCopy(html, visible = true) { copyText.innerHTML = html; copy.classList.toggle('show', visible); }
    function syncProgress(index) {
      progressIndex = Math.max(0, Math.min(maxProgress, index));
      stage.dataset.progress = progressIndex;
      progress.style.setProperty('--progress-width', `${progressIndex / maxProgress * 100}%`);
      hint.classList.toggle('hidden', progressIndex > 0);
      finalCopy.classList.remove('show');
    }
    function reset() {
      manualMode = false;
      clearTimeout(wheelTimer); wheelLocked = false; lastWheelAt = -Infinity;
      clearRun(); runId++; progressIndex = 0; syncProgress(0);
      stage.classList.remove('playing', 'manual-progression', 'fruit-scene', 'fruit-drop-active', 'fruit-split-active', 'sign-stage');
      hideSign();
      [fruit, fruitDrop, hand, palmGlow].forEach(element => element.removeAttribute('style'));
      saveThought.classList.remove('saved');
      saveThought.textContent = '存此一念';
      scene.className = 'scene quiet';
      afterScene.className = 'scene after';
      finalCopy.classList.remove('show');
      copy.classList.remove('show');
      clusters.forEach(c => c.classList.remove('vanish'));
      makeParticles();
      const id = runId;
      requestAnimationFrame(() => requestAnimationFrame(() => play(id)));
    }
    function play(id) {
      if (id !== runId) return;
      stage.classList.add('playing');
      setCopy(messages[0][1]);
      timers.push(setTimeout(() => { scene.className = 'scene bloom'; }, 500));
      clusters.forEach((cluster, i) => timers.push(setTimeout(() => cluster.classList.add('vanish'), 2150 + i * 295)));
      messages.slice(1).forEach(([time, html], i) => timers.push(setTimeout(() => { setCopy(html); syncProgress(i + 1); }, time)));
      // Complete the same sequence as wheel input: catch the fruit, open it, then reveal the keepsake.
      progressSteps.slice(6).forEach((time, index) => timers.push(setTimeout(() => {
        if (id === runId) finishStep(index + 6);
      }, time)));
    }
    function finishStep(index) {
      const target = Math.max(0, Math.min(maxProgress, index));
      syncProgress(target);
      // Manual positions are snapshots, so reversing also removes every later effect.
      stage.classList.remove('playing');
      stage.classList.add('manual-progression');
      stage.classList.toggle('fruit-scene', target >= 4);
      stage.classList.toggle('fruit-drop-active', target === 6);
      stage.classList.toggle('fruit-split-active', target === 7);
      if (target < maxProgress) hideSign();
      scene.className = target === 0 ? 'scene quiet' : 'scene bloom';
      afterScene.className = 'scene after';
      // 第 1～3 步只处理樱花与光点，第 4 步直接进入果实阶段，不再显示黄色球体能量核。
      clusters.forEach((cluster, i) => cluster.classList.toggle('vanish', target >= 1 && i < (target >= 3 ? 8 : target + 2)));
      particles.querySelectorAll('.particle').forEach(p => { p.style.opacity = target >= 2 && target < 4 ? .5 : 0; });
      fruit.style.opacity = target >= 4 && target < 6 ? 1 : 0;
      fruit.style.transform = 'translate(-50%, -50%) scale(1)';
      fruitDrop.style.opacity = target === 6 ? 1 : 0;
      hand.style.opacity = target >= 5 && target < maxProgress ? 1 : 0;
      hand.style.transform = 'translateX(-50%) translateY(0)';
      palmGlow.style.opacity = target >= 6 && target < maxProgress ? .35 : 0;
      if (target === 7) showSplit();
      const message = messages[Math.min(target, messages.length - 1)][1];
      if (target < maxProgress) setCopy(message);
      else { showSign(); }
    }
    function advance(direction) {
      const now = performance.now();
      if (wheelLocked || now - lastWheelAt < 430) return;
      const target = Math.max(0, Math.min(maxProgress, progressIndex + direction));
      if (target === progressIndex) return;
      if (!manualMode) { manualMode = true; clearRun(); runId++; }
      lastWheelAt = now; wheelLocked = true;
      finishStep(target);
      wheelTimer = setTimeout(() => wheelLocked = false, 430);
    }
    function skipToEnd() {
      clearRun(); runId++; manualMode = true;
      clearTimeout(wheelTimer); wheelLocked = false; lastWheelAt = -Infinity;
      finishStep(maxProgress);
    }
    function readingCard(target) {
      const card = target.closest?.('.sign-sheet');
      return card && signReveal.classList.contains('show') && card.scrollHeight > card.clientHeight + 1;
    }
    window.addEventListener('wheel', event => {
      if (readingCard(event.target)) return;
      event.preventDefault();
      if (event.deltaY) advance(event.deltaY > 0 ? 1 : -1);
    }, { passive: false });
    window.addEventListener('keydown', event => {
      if (event.target.closest?.('button, input, textarea, select, [contenteditable="true"]') || readingCard(event.target)) return;
      if (['ArrowDown', 'PageDown', 'ArrowRight', ' '].includes(event.key)) { event.preventDefault(); advance(1); }
      if (['ArrowUp', 'PageUp', 'ArrowLeft'].includes(event.key)) { event.preventDefault(); advance(-1); }
      if (event.key === 'Home') { event.preventDefault(); reset(); }
      if (event.key === 'End') { event.preventDefault(); skipToEnd(); }
    });
    let touchStartY = 0;
    let touchReading = false;
    window.addEventListener('touchstart', event => { touchReading = readingCard(event.target); touchStartY = event.changedTouches[0].clientY; }, { passive: true });
    window.addEventListener('touchend', event => { if (touchReading) return; const diff = touchStartY - event.changedTouches[0].clientY; if (Math.abs(diff) > 26) advance(diff > 0 ? 1 : -1); }, { passive: true });
    document.querySelector('#replay').addEventListener('click', reset);
    document.querySelector('#skip').addEventListener('click', skipToEnd);
    const details=document.querySelector('#readingDetails'),intro=document.querySelector('#detailIntro');
    let detailRun=0;
    const detailStatus=createReadingStatus(details,async preset=>{try{await TempleFlow.retryGeneration({preset});await loadDetail();}catch(error){detailStatus.error(error);}});
    async function loadDetail(){
      const run=++detailRun;saveThought.disabled=true;detailStatus.waiting();
      try{
        const snap=await TempleFlow.drawSign();if(run!==detailRun)return;
        detailStatus.hide();intro.textContent=snap.reading.summary.title;
        document.querySelector('.sign-kicker').textContent=snap.mode==='preset'?'预置案例演示 · 菩提树下':'菩提树下 · 展开这一念';
        details.querySelectorAll('.detail-section').forEach(el=>el.remove());
        for(const [key,label] of [['understanding','照见心事'],['possibility','可能的走向'],['suggestion','如何安放'],['nextStep','带回现实的一小步'],['basis','回应依据']]){
          const section=document.createElement('section');section.className='detail-section';if(key==='basis')section.classList.add('reading-basis');
          const heading=document.createElement('h3'),text=document.createElement('p');heading.textContent=label;text.textContent=snap.reading.detail[key];section.append(heading,text);details.append(section);
        }
        saveThought.disabled=false;
      }catch(error){if(run===detailRun){intro.textContent='这一念尚未展开';detailStatus.error(error);}}
    }
    loadDetail();
    window.addEventListener('pagehide',()=>{detailRun++;});
    saveThought.addEventListener('click',async()=>{
      if(saveThought.disabled)return;saveThought.disabled=true;saveThought.textContent='正在收好…';
      try{await TempleFlow.save();saveThought.classList.add('saved');saveThought.textContent='已存此一念';if(window.parent!==window)window.parent.postMessage({type:'bodhi-complete'},location.origin);}
      catch(error){saveThought.disabled=false;saveThought.textContent='存此一念';detailStatus.error(error);}
    });
    if (document.documentElement.classList.contains('bodhi-arriving')) window.addEventListener('bodhi:ready', reset, {once:true});
    else reset();
  </script>
<script src="blossom-dissolve.js"></script></body>
