<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#112d2b"><meta name="description" content="银花寺 · 山门入寺、许愿池寄愿、大雄宝殿礼佛、菩提树下，一段完整的四章旅程">
<title>银花寺 · 一念入山</title>
<link rel="stylesheet" href="story.css">
<style id="pb-embed-hide-chrome">#pb-host-splash,#pb-host-banner,#pb-host-badge,#pb-host-mark,#pb-host-widget,#pb-host-mask{display:none !important;visibility:hidden !important;opacity:0 !important;pointer-events:none !important}</style></head>
<body>
  <main class="story-shell" aria-label="银花寺连续故事">
    <div class="ink-wash" aria-hidden="true"></div>
    <header class="story-topbar">
      <a class="story-brand" href="index.html" aria-label="回到故事开篇"><span class="brand-seal">银</span><span>银花寺</span></a>
      <div class="story-meta"><span id="chapterKicker">序章 · 入山</span><span class="meta-dot"></span><span id="chapterCounter">01 / 04</span></div>
      <button id="soundHint" class="story-sound" type="button" aria-label="提示">听风入境</button>
    </header>
    <aside class="chapter-rail" aria-label="故事章节">
      <button class="rail-step active" data-chapter="0"><span class="rail-seal">门</span><span class="rail-copy"><b>山门</b><small>入寺</small></span></button>
      <span class="rail-line"></span>
      <button class="rail-step" data-chapter="1"><span class="rail-seal">愿</span><span class="rail-copy"><b>许愿池</b><small>寄一枚心愿</small></span></button>
      <span class="rail-line"></span>
      <button class="rail-step" data-chapter="2"><span class="rail-seal">佛</span><span class="rail-copy"><b>大雄宝殿</b><small>一念清净</small></span></button>
      <span class="rail-line"></span>
      <button class="rail-step" data-chapter="3"><span class="rail-seal">树</span><span class="rail-copy"><b>菩提树下</b><small>参悟完成</small></span></button>
    </aside>
    <section class="story-stage" id="storyStage">
      <div class="chapter-intro" id="chapterIntro" aria-live="polite">
        <p class="intro-overline">SILVER FLOWER TEMPLE · STORY 01</p>
        <h1 id="introTitle">循着风声，<br><em>来到山门前。</em></h1>
        <p id="introCopy">把迷茫与遗憾交给一阵风，沿着石径，慢慢走进这一段因缘。</p>
        <button id="startStory" class="start-button">从山门开始 <span>↘</span></button>
      </div>
      <div class="frame-wrap" id="frameWrap" aria-hidden="true">
        <iframe id="storyFrame" title="故事章节" src="about:blank" allow="autoplay; microphone"></iframe>
        <div class="frame-shade" id="frameShade"></div>
        <div class="frame-caption" id="frameCaption"><span class="caption-seal">一</span><span id="captionText">静候入境</span></div>
      </div>
      <section class="story-ending" id="storyEnding" hidden>
        <div class="ending-seal">银花</div>
        <p class="intro-overline">THE WALK IS KEPT IN YOUR HEART</p>
        <h2>果已得，<br><em>路仍长。</em></h2>
        <p>带着那一小步，回到日常里。风会记得你曾来过。</p>
        <button id="restartStory" class="start-button">再走一遍 <span>↗</span></button>
      </section>
    </section>
    <footer class="story-footer"><span id="footerHint">点击进入故事</span><span class="footer-rule"></span><span>静 · 慢 · 真</span></footer>
  </main>
<script src="story.js"></script>
