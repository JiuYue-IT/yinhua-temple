<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>序幕 · 音效搭配试听</title><style>body{margin:0;background:#080b0b;color:#eee9de;font:15px/1.8 "Microsoft YaHei",sans-serif}main{max-width:1000px;margin:40px auto;padding:0 24px}h1{font:28px SimSun,serif}header p{color:#a6b4ac;font-size:13px}.stage{height:260px;position:relative;display:grid;place-items:center;border:1px solid #ffffff15;border-radius:16px;margin:28px 0;overflow:hidden}.verse{font:24px/2 SimSun,serif;text-align:center}canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}article{padding:22px;background:#ffffff06;border:1px solid #ffffff18;border-radius:12px}h2{font-size:17px}small,a{color:#b4c8bc;font-size:12px}button{margin:18px 0 8px;padding:12px 18px;background:#d9e7d9;color:#214637;border:0;border-radius:24px;cursor:pointer;font:600 14px "Microsoft YaHei"}audio{width:100%;height:36px}label{display:block;font-size:13px}#status{color:#e6bfce;font-size:13px;min-height:24px}@media(max-width:700px){.cards{grid-template-columns:1fr}.stage{height:200px}}</style><main><header><h1>一念散去 · 音效试听</h1><p>点击“搭配动画试听”，比较五种声音。也可用下方播放器单独试听。④、⑤是新增的风声候选，①也是短风声。素材在线播放，尚未接入游戏。</p></header><div class="stage"><div class="verse">愿未说，念未放</div><canvas></canvas></div><label>试听音量 <input id="volume" type="range" min="0" max="1" step=".05" value=".3"></label><p id="status">请选择一个音效</p><div class="cards"><article><h2>① 风拂文字</h2><small>Whoosh wind sweep</small><br><button data-index="0">搭配动画试听</button><audio controls preload="none" src="https://assets.mixkit.co/active_storage/sfx/2632/2632-preview.mp3"></audio><a href="https://mixkit.co/free-sound-effects/woosh/" target="_blank" rel="noopener">来源与下载页面</a></article><article><h2>② 悠长魔法风</h2><small>Wind magic whoosh</small><br><button data-index="1">搭配动画试听</button><audio controls preload="none" src="https://assets.mixkit.co/active_storage/sfx/2610/2610-preview.mp3"></audio><a href="https://mixkit.co/free-sound-effects/woosh/" target="_blank" rel="noopener">来源与下载页面</a></article><article><h2>③ 樱花微光</h2><small>Magic sparkle whoosh</small><br><button data-index="2">搭配动画试听</button><audio controls preload="none" src="https://assets.mixkit.co/active_storage/sfx/2350/2350-preview.mp3"></audio><a href="https://mixkit.co/free-sound-effects/cinematic/" target="_blank" rel="noopener">来源与下载页面</a></article><article><h2>④ 空气掠过 · 2秒</h2><small>Air woosh · 纯风声方向候选</small><br><button data-index="3">搭配动画试听</button><audio controls preload="none" src="https://assets.mixkit.co/active_storage/sfx/1489/1489-preview.mp3"></audio><a href="https://mixkit.co/free-sound-effects/woosh/" target="_blank" rel="noopener">来源与下载页面</a></article><article><h2>⑤ 风吹掠过 · 3秒</h2><small>Woosh wind · 纯风声方向候选</small><br><button data-index="4">搭配动画试听</button><audio controls preload="none" src="https://assets.mixkit.co/active_storage/sfx/1168/1168-preview.mp3"></audio><a href="https://mixkit.co/free-sound-effects/woosh/" target="_blank" rel="noopener">来源与下载页面</a></article></div></main><script>
const audios=[...document.querySelectorAll('audio')],stage=document.querySelector('.stage'),verse=document.querySelector('.verse'),canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let raf;
for(const a of audios){a.volume=.3;a.addEventListener('play',()=>audios.forEach(b=>{if(a!==b)b.pause()}));}
document.querySelector('#volume').oninput=e=>audios.forEach(a=>a.volume=Number(e.target.value));
document.querySelectorAll('[data-index]').forEach(button=>button.onclick=async()=>{
 cancelAnimationFrame(raf);audios.forEach(a=>{a.pause();a.currentTime=0});verse.style.opacity=1;
 const index=Number(button.dataset.index),a=audios[index];verse.textContent=index===2?'因念而花开':'愿未说，念未放';verse.style.color=index===2?'#f2c8d3':'#eee9de';
 document.querySelector('#status').textContent='正在加载音效…';
 try{await a.play()}catch{document.querySelector('#status').textContent='音效未能加载，请使用素材来源页面试听。';return}
 document.querySelector('#status').textContent='正在试听：'+button.closest('article').querySelector('h2').textContent;
 canvas.width=stage.clientWidth;canvas.height=stage.clientHeight;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.font='24px SimSun';ctx.textAlign='center';ctx.fillStyle=verse.style.color;ctx.fillText(verse.textContent,canvas.width/2,canvas.height/2+8);
 const data=ctx.getImageData(0,0,canvas.width,canvas.height).data,points=[];for(let y=0;y<canvas.height;y+=2)for(let x=0;x<canvas.width;x+=2){if(data[(y*canvas.width+x)*4+3]>40)points.push({x,y,r:Math.random()})}
 verse.style.opacity=0;const start=performance.now();
 function tick(now){const t=(now-start)/1000;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.fillStyle=index===2?'#f2c8d3':'#eee9de';for(const p of points){const delay=(canvas.width/2+110-p.x)/220*.5,age=Math.max(0,t-delay);ctx.globalAlpha=Math.max(0,1-age/1.2);ctx.fillRect(p.x+age*(75+p.r*100),p.y-age*(10+p.r*30),1.3,1.3)}ctx.globalAlpha=1;if(t<2.5)raf=requestAnimationFrame(tick);else{ctx.clearRect(0,0,canvas.width,canvas.height);verse.style.opacity=1}}
 raf=requestAnimationFrame(tick);
});</script></html>
