server:
  port: 8080

spring:
  application:
    name: life-branch-server
  config:
    # 自动读取 server/.env（KEY=VALUE，不提交到 git）；同名系统环境变量优先。测试中通过 LB_ENV_FILE 关闭
    import: optional:file:${LB_ENV_FILE:.env}[.properties]
  jackson:
    # 快照中的 null 字段（story / receipt / error 等）必须保留输出
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
  web:
    resources:
      # 前端 npm run build 生成 web/dist 后，由后端在 http://localhost:8080/ 直接托管（单端口演示）
      static-locations: classpath:/static/,file:${app.web.dist}

app:
  web:
    # 相对于启动目录 server/；也可用环境变量 WEB_DIST 指定绝对路径（以 / 结尾）
    dist: ${WEB_DIST:../web/dist/}
  ai:
    # anthropic（默认，官方 SDK）| openai（OpenAI 兼容 chat/completions）
    provider: ${AI_PROVIDER:anthropic}
    endpoint: ${AI_ENDPOINT:}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:claude-opus-5}
    # anthropic 协议鉴权头：x-api-key | bearer（中转站要求 Authorization: Bearer 时改为 bearer）
    auth-header: ${AI_AUTH:x-api-key}
    # low | medium | high | xhigh | max；设为空字符串则不发送（中转站不支持时）
    effort: ${AI_EFFORT:low}
    structured-output: ${AI_STRUCTURED_OUTPUT:true}
    refusal-fallback: ${AI_REFUSAL_FALLBACK:true}
    max-tokens: 16000
    request-timeout-seconds: 25
    task-timeout-seconds: 30
  preset:
    # 预置案例的固定停顿（毫秒），页面始终标注为预置案例
    delay-ms: 2000
  device:
    # serial | dryrun；dryrun 只记录模拟事件，health 中显示为 dryrun
    mode: ${DEVICE_MODE:dryrun}
    serial-port: ${SERIAL_PORT:}
